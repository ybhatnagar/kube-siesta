# Synthetic workloads for the real-collection demo, in namespace `demo-workloads`.
#  • periodic-batch : ~5 min CPU burst every 20 min, idle otherwise  -> the CANDIDATE
#  • steady-idle    : flat, near-zero CPU (no spikes)                 -> non-candidate
#  • busy-loop      : constant CPU (always active)                    -> non-candidate
# cAdvisor (via the kubelet) + kube-state-metrics scrape these; the recording rule
# namespace_workload_pod:kube_pod_owner:relabel maps their pods -> workload.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-workloads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: periodic-batch
  namespace: demo-workloads
  labels: {app: periodic-batch}
spec:
  replicas: 1
  selector: {matchLabels: {app: periodic-batch}}
  template:
    metadata: {labels: {app: periodic-batch}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          # 240s busy-looping (throttled to the 0.5-core limit) then 1560s idle
          # => 30-min period, 4-min burst. With the collector's rate[5m] the active
          # region is ~9 min / 30 min (~30%), a clean candidate under the 50% filter.
          command: ["/bin/sh", "-c", "while true; do t=$(( $(date +%s) + 240 )); while [ $(date +%s) -lt $t ]; do :; done; sleep 1560; done"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady-idle
  namespace: demo-workloads
  labels: {app: steady-idle}
spec:
  replicas: 1
  selector: {matchLabels: {app: steady-idle}}
  template:
    metadata: {labels: {app: steady-idle}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy-loop
  namespace: demo-workloads
  labels: {app: busy-loop}
spec:
  replicas: 1
  selector: {matchLabels: {app: busy-loop}}
  template:
    metadata: {labels: {app: busy-loop}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          # constant busy loop, throttled to ~0.2 core by the limit => always active.
          command: ["/bin/sh", "-c", "while true; do :; done"]
          resources:
            requests: {cpu: 100m, memory: 16Mi}
            limits: {cpu: 200m, memory: 32Mi}
