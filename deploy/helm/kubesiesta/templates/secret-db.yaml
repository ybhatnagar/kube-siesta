{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubesiesta.dbSecretName" . }}
  labels:
    {{- include "kubesiesta.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full connection string consumed by the collector + engine as KUBESIESTA_DB_DSN.
  dsn: {{ include "kubesiesta.dbDsn" . | quote }}
{{- end }}
