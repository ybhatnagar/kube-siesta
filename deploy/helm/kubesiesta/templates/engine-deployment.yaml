apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubesiesta.engine.fullname" . }}
  labels:
    {{- include "kubesiesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicas }}
  selector:
    matchLabels:
      {{- include "kubesiesta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "kubesiesta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
    spec:
      serviceAccountName: {{ include "kubesiesta.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: "{{ .Values.images.engine.repository }}:{{ .Values.images.engine.tag }}"
          imagePullPolicy: {{ .Values.images.engine.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          env:
            {{- include "kubesiesta.dbEnv" . | nindent 12 }}
            - name: KUBESIESTA_CORS_ORIGINS
              value: {{ .Values.engine.corsOrigins | quote }}
            - name: TMPDIR
              value: /tmp
            {{- if .Values.collector.service.enabled }}
            - name: KUBESIESTA_COLLECTOR_URL
              value: "http://{{ include "kubesiesta.fullname" . }}-collector-svc:{{ .Values.collector.service.port }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- include "kubesiesta.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.engine.podResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
