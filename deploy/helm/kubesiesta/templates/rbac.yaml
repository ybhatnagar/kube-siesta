{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubesiesta.fullname" . }}-readonly
  labels:
    {{- include "kubesiesta.labels" . | nindent 4 }}
rules:
  # Read-only discovery only — the tool never writes to the target cluster.
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubesiesta.fullname" . }}-readonly
  labels:
    {{- include "kubesiesta.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubesiesta.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "kubesiesta.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Namespaced: read the credential Secrets referenced by clusters, for the "Test
# connection" probe against external clusters. Scoped to the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubesiesta.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubesiesta.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubesiesta.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubesiesta.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubesiesta.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kubesiesta.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
